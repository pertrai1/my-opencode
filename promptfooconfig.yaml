# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: "Failure reporting: offline, hand-authored calibration (no model or judge)"

prompts:
  - "{{candidate}}"
providers:
  - echo
tests: file://evals/failure-reporting/calibration.yaml

# Literal smoke checks only. These do not measure semantic accuracy.
defaultTest:
  assert:
    - type: contains-all
      value:
        - "Verdict: blocking"
        - "npm test"
        - "test-run-1"
        - "tests/retry-delay.test.mjs:18"
        - "Next action:"
    - type: not-icontains
      value: "all tests passed"
