# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# OPTIONAL PAID MODEL + GRADER: synthetic evidence, not a live repository review.
description: "Review risk: model assessments of supplied evidence"
prompts:
  - file://prompt.mjs
providers:
  - id: "{{ env.REVIEW_RISK_PROVIDER | trim }}"
    config:
      reasoning_effort: low
      max_completion_tokens: 8000
tests: file://cases.mjs
defaultTest:
  options:
    provider:
      id: "{{ env.REVIEW_RISK_GRADER | trim }}"
      config:
        reasoning_effort: low
        max_completion_tokens: 8000
    rubricPrompt: file://grader.mjs
  assert:
    - type: javascript
      value: file://mechanics.mjs
