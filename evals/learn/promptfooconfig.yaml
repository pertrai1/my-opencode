# Optional live model evaluation; provider calls require separate authorization.
description: "Learn: pre-write decisions on synthetic repository snapshots"
prompts:
  - file://prompt.js
providers:
  - id: openai:chat:gpt-4o
    config:
      temperature: 0
      max_tokens: 600
      response_format:
        type: json_object
evaluateOptions:
  maxConcurrency: 1
tests: file://examples.yaml
defaultTest:
  assert:
    - type: is-json
      value:
        type: object
        additionalProperties: false
        required: [decision, target, learning, reason]
        properties:
          decision: {enum: [retain, skip]}
          target: {type: [string, "null"]}
          learning: {type: [string, "null"]}
          reason: {type: string, minLength: 1}
    - type: javascript
      metric: decisionAndScope
      value: |
        let answer;
        try { answer = JSON.parse(output); } catch { return false; }
        if (!answer || typeof answer.reason !== "string" || !answer.reason.trim()) return false;
        const expected = context.vars.expected;
        if (answer.decision !== expected.decision || answer.target !== expected.target) return false;
        if (answer.decision === "skip") return answer.learning === null;
        return typeof answer.learning === "string" && answer.learning.trim().length > 0
          && answer.learning.trim().split(/\r?\n/).length <= 3;
    - type: not-contains
      metric: syntheticPrivacyMarker
      value: "[SYNTHETIC_"
